
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>Universal Document Converter PRO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1120;color:#f1f5f9;font-family:Arial,sans-serif}
header{padding:24px 18px;background:#111c30;border-bottom:1px solid #293951}
h1{font-size:23px;margin:0 0 8px}
header p,.muted{color:#aab8ca;font-size:13px;line-height:1.6}
main{max-width:720px;margin:auto;padding:18px}
.card{background:#131f33;border:1px solid #293951;border-radius:15px;padding:17px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 13px}
input[type=file]{width:100%;padding:12px;background:#0b1424;color:#fff;border-radius:9px}
input[type=text]{width:100%;padding:13px;background:#0b1424;color:white;border:1px solid #34445c;border-radius:9px;margin:8px 0}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#2563eb;color:white;font-size:15px;font-weight:bold;margin-top:10px}
button:disabled{opacity:.4}
.secondary{background:#334155}
#status{font-size:13px;color:#67e8a5;white-space:pre-wrap;line-height:1.6}
#files{font-size:13px;color:#cbd5e1;line-height:1.8;overflow-wrap:anywhere}
footer{text-align:center;color:#718096;font-size:12px;padding:25px}
</style>
</head>
<body>
<header>
<h1>Universal Document Converter PRO</h1>
<p>Peşəkar sənəd emalı platforması</p>
</header>
<main>
<section class="card">
<h2>📂 PDF faylları seç</h2>
<input id="pdfFiles" type="file" accept="application/pdf,.pdf" multiple>
<div id="files" class="muted">Hələ fayl seçilməyib.</div>
</section>

<section class="card">
<h2>📑 PDF alətləri</h2>
<button id="merge">PDF fayllarını birləşdir</button>
<button id="split" class="secondary">Hər səhifəni ayrıca PDF et</button>
</section>

<section class="card">
<h2>✂️ Səhifə çıxarma</h2>
<p class="muted">Bir PDF seç və çıxarmaq istədiyin səhifələri yaz. Məsələn: 1-3, 5, 8-10</p>
<input id="pages" type="text" placeholder="Məsələn: 1-3, 5, 8">
<button id="extract">Seçilmiş səhifələri çıxar</button>
</section>

<section class="card">
<h2>⚙️ Sistem vəziyyəti</h2>
<div id="status">PDF mühərriki yüklənir...</div>
</section>
</main>
<footer>Universal Document Converter PRO</footer>

<script src="./libs/pdf-lib.min.js"></script>
<script>
const picker=document.getElementById('pdfFiles');
const filesBox=document.getElementById('files');
const statusBox=document.getElementById('status');
const mergeBtn=document.getElementById('merge');
const splitBtn=document.getElementById('split');
const extractBtn=document.getElementById('extract');
let selected=[];

function ready(){
 return typeof PDFLib!=='undefined';
}
function setStatus(message){
 statusBox.textContent=message;
}
function downloadPdf(bytes,name){
 const blob=new Blob([bytes],{type:'application/pdf'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;
 a.download=name;
 document.body.appendChild(a);
 a.click();
 a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),30000);
}
picker.addEventListener('change',()=>{
 selected=Array.from(picker.files||[]);
 filesBox.textContent=selected.length
 ?selected.map((f,i)=>(i+1)+'. '+f.name+' ('+(f.size/1024).toFixed(1)+' KB)').join('\n')
 :'Hələ fayl seçilməyib.';
 setStatus(selected.length+' fayl seçildi.');
});
async function loadPdf(file){
 const bytes=await file.arrayBuffer();
 return await PDFLib.PDFDocument.load(bytes);
}
mergeBtn.addEventListener('click',async()=>{
 if(!ready()){setStatus('PDF mühərriki yüklənməyib. İnternet bağlantısını yoxla.');return;}
 if(selected.length<2){setStatus('Birləşdirmək üçün ən azı 2 PDF seç.');return;}
 try{
  setStatus('PDF faylları birləşdirilir...');
  const merged=await PDFLib.PDFDocument.create();
  for(const file of selected){
   const doc=await loadPdf(file);
   const pages=await merged.copyPages(doc,doc.getPageIndices());
   pages.forEach(p=>merged.addPage(p));
  }
  const bytes=await merged.save();
  downloadPdf(bytes,'birlesdirilmis-sened.pdf');
  setStatus('Hazırdır! Birləşdirilmiş PDF yükləndi.');
 }catch(e){setStatus('Xəta: PDF fayllarından biri zədələnmiş və ya qorunmuş ola bilər.\n'+e.message);}
});
splitBtn.addEventListener('click',async()=>{
 if(!ready()){setStatus('PDF mühərriki yüklənməyib.');return;}
 if(selected.length!==1){setStatus('Ayrı-ayrı səhifələrə bölmək üçün yalnız 1 PDF seç.');return;}
 try{
  setStatus('Səhifələr ayrılır...');
  const source=await loadPdf(selected[0]);
  const total=source.getPageCount();
  for(let i=0;i<total;i++){
   const part=await PDFLib.PDFDocument.create();
   const [page]=await part.copyPages(source,[i]);
   part.addPage(page);
   const bytes=await part.save();
   downloadPdf(bytes,'sehife-'+(i+1)+'.pdf');
  }
  setStatus(total+' səhifə ayrıca PDF faylları kimi hazırlandı.');
 }catch(e){setStatus('Xəta: '+e.message);}
});
extractBtn.addEventListener('click',async()=>{
 if(!ready()){setStatus('PDF mühərriki yüklənməyib.');return;}
 if(selected.length!==1){setStatus('Səhifə çıxarmaq üçün yalnız 1 PDF seç.');return;}
 try{
  const source=await loadPdf(selected[0]);
  const total=source.getPageCount();
  const input=document.getElementById('pages').value.trim();
  if(!input){setStatus('Səhifə nömrələrini daxil et.');return;}
  const indexes=new Set();
  for(const part of input.split(',')){
   const p=part.trim();
   if(/^\d+$/.test(p)){
    indexes.add(Number(p)-1);
   }else if(/^\d+\s*-\s*\d+$/.test(p)){
    const [a,b]=p.split('-').map(x=>Number(x.trim()));
    if(a>b)throw new Error('Səhifə aralığı düzgün deyil: '+p);
    for(let n=a;n<=b;n++)indexes.add(n-1);
   }else throw new Error('Düzgün olmayan səhifə yazılışı: '+p);
  }
  const chosen=Array.from(indexes).sort((a,b)=>a-b);
  if(chosen.some(n=>n<0||n>=total))throw new Error('Səhifə sayı 1 ilə '+total+' arasında olmalıdır.');
  const output=await PDFLib.PDFDocument.create();
  const pages=await output.copyPages(source,chosen);
  pages.forEach(p=>output.addPage(p));
  const bytes=await output.save();
  downloadPdf(bytes,'secilmis-sehifeler.pdf');
  setStatus(chosen.length+' səhifə yeni PDF faylına çıxarıldı.');
 }catch(e){setStatus('Xəta: '+e.message);}
});
if(ready())setStatus('PDF mühərriki hazırdır.');
else{
 const check=setInterval(()=>{
  if(ready()){clearInterval(check);setStatus('PDF mühərriki hazırdır.');}
 },500);
 setTimeout(()=>{clearInterval(check);if(!ready())setStatus('PDF mühərriki yüklənmədi. İnternet bağlantısını yoxla və səhifəni yenilə.');},12000);
}
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(() => console.log("Offline rejim aktivdir"))
      .catch((error) => console.error("Xəta:", error));
  });
}
</script>
</body>
 </html>
